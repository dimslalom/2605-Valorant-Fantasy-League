name: Feed poll

# Pulls finished matches from vlr.gg through the vendored vlrggapi and posts
# them to the Worker. Runs every 30 minutes; the job itself exits in seconds
# when nothing new has finished. GitHub schedules can be delayed and are
# disabled after 60 days without repo activity.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max matches to fetch this run'
        default: '6'

permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/vlrggapi/requirements-runtime.txt
      - run: pip install -r tools/vlrggapi/requirements-runtime.txt
      - name: Start vlrggapi
        working-directory: tools/vlrggapi
        env:
          VLR_MIN_INTERVAL_S: '1.5'
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 3001 --log-level warning > "$RUNNER_TEMP/vlrggapi.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3001/v2/health >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vlrggapi.log"; exit 1
      - name: Poll and ingest
        env:
          VLR_API_BASE: http://127.0.0.1:3001
          FEED_BASE_URL: https://vctfantasy.dimas.works
          FEED_INGEST_TOKEN: ${{ secrets.FEED_INGEST_TOKEN }}
        run: node scripts/feed/run.js --mode poll --limit "${{ inputs.limit || '6' }}"
